<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="./api/scan.js"></script>
</head>

<body>
    <h1 id="scan-results"></h1>
</body>
<script type="module">
    import { scan } from './api/scan.js';

    scan("a", "label").then(value => {
        // 1. Select the element by its ID
        const heading = document.getElementById("scan-results");

        // 2. Change its text
        heading.textContent = `${value}`;
        console.log('Found value: ', value);
    });

</script>


</html>
